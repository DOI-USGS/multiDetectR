# GitLab CI/CD for multiDetectR
# Runs on code.usgs.gov chs-shared runners.
# Uses the public rocker/r-ver image and installs dependencies at job time, so
# there is no project registry image to build or maintain (avoids the
# "manifest unknown" chicken-and-egg problem of a self-hosted CI image).

stages:
  - check
  - test

variables:
  _R_CHECK_FORCE_SUGGESTS_: "false"
  _R_CHECK_NO_STOP_ON_TEST_ERROR_: "true"

default:
  image: rocker/r-ver:4.6.1
  tags:
    - chs-shared
  timeout: 1 hour
  before_script:
    # System libraries for building packages and rendering vignettes.
    # Each command is a YAML double-quoted scalar so the parser does not try to
    # read the colons (https://, "missing packages:") as nested mapping keys.
    - "apt-get update -qq && apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev libxml2-dev pandoc"
    # Bootstrap the installer, then install the package's declared dependencies
    # (Imports + Suggests from DESCRIPTION, including knitr/rmarkdown for the
    # vignettes).
    - "Rscript -e 'install.packages(c(\"remotes\", \"rcmdcheck\"), repos = \"https://cloud.r-project.org\", Ncpus = 4)'"
    - "Rscript -e 'remotes::install_deps(dependencies = TRUE, upgrade = \"never\", Ncpus = 4)'"
    # Verify every tool the check needs actually installed, and abort with a
    # clear message if not -- rather than failing deep inside the vignette
    # rebuild (install.packages only warns on a failed install, it does not stop).
    # Note: devtools is intentionally NOT required -- it drags in a large,
    # system-library-heavy dependency tree (gert/libgit2, pkgdown, ragg) that we
    # do not need; rcmdcheck runs the check and testthat runs the tests.
    - "Rscript -e 'need <- c(\"knitr\", \"rmarkdown\", \"rcmdcheck\", \"remotes\", \"shiny\", \"DT\", \"testthat\"); miss <- need[!vapply(need, requireNamespace, logical(1), quietly = TRUE)]; if (length(miss)) stop(paste(\"missing packages\", paste(miss, collapse = \", \")))'"

# R CMD check (builds and checks the package, including vignettes)
r-cmd-check:
  stage: check
  script:
    - "Rscript -e 'rcmdcheck::rcmdcheck(args = c(\"--no-manual\"), error_on = \"error\", check_dir = \"check\")'"
  artifacts:
    paths:
      - check/
    when: always
    expire_in: 1 week
  allow_failure: false

# Run the testthat suite
run-tests:
  stage: test
  script:
    - "Rscript -e 'testthat::test_local(stop_on_failure = TRUE)'"
  artifacts:
    paths:
      - tests/
    when: always
    expire_in: 1 week
